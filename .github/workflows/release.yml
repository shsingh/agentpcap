# SLSA provenance and signed releases are normative in the spec:
# docs/spec.md#171-release-signing-and-provenance (§17.1)

name: release

on:
  push:
    tags: ["2026.*"]

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the gate report exists for this tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          test -f "releases/${TAG}.md" || { echo "no gate report releases/${TAG}.md"; exit 1; }
      - name: Create the draft release from the signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "releases/${GITHUB_REF_NAME}.md"

  build-and-attest:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: agentpcap-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: agentpcap-linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the eBPF toolchain
        run: |
          rustup toolchain install nightly --component rust-src
          # bpf-linker 0.13 defaults to the llvm-23 feature (llvm-sys-23 =
          # the LLVM 23 bindings; llvm-20/19 lack the symbols it calls).
          # The official apt script installs llvm-23-dev + clang + lld +
          # libpolly; the script is checksum-pinned.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          echo "03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae  llvm.sh" | sha256sum -c - >/dev/null
          chmod +x llvm.sh
          sudo -E ./llvm.sh 23 all
          # exports apply to this same shell: cargo install needs them now
          export PATH="/usr/lib/llvm-23/bin:$PATH"
          export LLVM_PREFIX=/usr/lib/llvm-23
          export LLVM_SYS_231_PREFIX=/usr/lib/llvm-23
          cargo install --locked bpf-linker
          # and ride the environment for the later build steps
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
      - name: Build the eBPF probe (the CLI embeds it)
        run: |
          cargo +nightly build --manifest-path crates/agentpcap-ebpf/Cargo.toml \
            --target bpfel-unknown-none -Zbuild-std=core --release
          test -f crates/agentpcap-ebpf/target/bpfel-unknown-none/release/agentpcap
      - name: Build the userspace binary
        run: |
          rustup update stable
          cargo build --release -p agentpcap
          cp target/release/agentpcap "${{ matrix.asset }}"
      - name: SLSA v1.0 build provenance (ADR-0003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}
      - name: Upload the attested binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset }}" --clobber

  publish:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" -R "${{ github.repository }}" --draft=false
